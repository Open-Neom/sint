name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  correctness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The standalone design packages require Flutter >=3.44 / Dart >=3.12.
        # Keep the supported baseline and exercise the latest stable Flutter 3.x.
        flutter: ["3.44.4", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ matrix.flutter }}"
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter pub get
        working-directory: performance
      - run: flutter analyze
      - name: Correctness and coverage (benchmark harness checks included)
        run: flutter test --coverage --exclude-tags=benchmark --test-randomize-ordering-seed=142857
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.flutter }}
          path: coverage/lcov.info
      - name: Performance app correctness
        run: flutter test --no-pub
        working-directory: performance

  performance:
    runs-on: ubuntu-latest
    needs: correctness
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Serial JIT measurements without coverage
        run: dart run tool/benchmark_runner.dart --full --output=build/benchmarks/ci.json
      # Hosted workers are not a stable historical baseline. Archive samples;
      # compare paired runs on one host using the explicitly budgeted tool.
      - name: Upload raw samples and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-samples
          path: |
            build/benchmarks/ci.json
            build/benchmarks/ci.json.log
          if-no-files-found: error
