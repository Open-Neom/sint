name: sint
description: SINT (State, Injection, Navigation, Translation) - The Four Pillars of High-Fidelity Flutter Infrastructure.
version: 1.7.0-dev.1
homepage: https://github.com/Open-Neom/sint

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Later releases use foundation.awaitNotRequired, absent in Flutter 3.44.
  # Keep the declared SDK floor usable until upstream fixes that requirement.
  material_ui: ">=1.1.1 <1.3.0"
  cupertino_ui: ">=1.0.0 <1.1.0"
  web: ">=1.0.0 <2.0.0"

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
